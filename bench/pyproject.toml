[project]
name = "payeebench"
version = "0.1.0"
description = "PayeeBench-JA: a Japanese-first payee-verification benchmark for System-1 decision models (Jev, Kev, LLMs)"
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy>=2.0",
    "matplotlib>=3.9",
    "anthropic>=1.8.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["payeebench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
